<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimDAWA | Menghubungkan ke Aplikasi...</title>
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #f4f7fe 0%, #eef2f3 100%); 
            margin: 0; 
        }
        .wrapper { 
            text-align: center; 
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(112, 144, 176, 0.15);
            max-width: 360px;
            width: 90%;
        }
        .logo-area {
            font-size: 28px;
            font-weight: 800;
            color: #4318ff;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .sub-logo {
            font-size: 12px;
            color: #a3aed0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        h2 { color: #2b3674; margin: 0 0 8px 0; font-size: 18px; font-weight: 700; }
        p { color: #a3aed0; font-size: 14px; margin: 0 0 30px 0; line-height: 1.5; }
        
        /* Animasi Loading Spinner Modern */
        .spinner {
            margin: 0 auto 25px auto;
            width: 44px;
            height: 44px;
            border: 4px solid #f4f7fe;
            border-top: 4px solid #4318ff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.1, 1) infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-text {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 10px;
        }
        /* Tombol darurat jika browser lambat */
        .btn-manual {
            display: inline-block;
            font-size: 12px;
            color: #4318ff;
            text-decoration: none;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>

    <script>
        // Masukkan URL Google Apps Script Anda di sini
        var urlTujuan = "https://script.google.com/macros/s/AKfycbzASBbH_MbdNFcws62JU69WIuWC6Q1nV2WuoAnorVlAe7jd3elSlqpklNm6mSikGNlCbQ/exec";
        
        // Eksekusi pengalihan menggunakan 'replace' agar tombol 'Back' di browser tidak terjebak loop
        window.location.replace(urlTujuan);
    </script>
</head>
<body>

    <div class="wrapper">
        <div class="logo-area">SimDAWA</div>
        <div class="sub-logo">Sistem Data Warga</div>
        
        <div class="spinner"></div>
        
        <h2>Mengompres Tautan...</h2>
        <p>Sedang mengalihkan Anda ke server aman secara otomatis.</p>
        
        <a href="https://script.google.com/macros/s/AKfycbzASBbH_MbdNFcws62JU69WIuWC6Q1nV2WuoAnorVlAe7jd3elSlqpklNm6mSikGNlCbQ/exec" class="btn-manual">Klik di sini jika tidak berpindah otomatis</a>
        <div class="footer-text">Kelurahan Bunut Wetan</div>
    </div>

</body>
</html>
