<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka SimDAWA...</title>
    
    <script>
        // Mengarahkan pengguna langsung ke aplikasi Google Script secara otomatis
        window.location.replace("https://script.google.com/macros/s/AKfycbzASBbH_MbdNFcws62JU69WIuWC6Q1nV2WuoAnorVlAe7jd3elSlqpklNm6mSikGNlCbQ/exec");
    </script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f4f7fe; 
            margin: 0; 
        }
        .loading-container { 
            text-align: center; 
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(112, 144, 176, 0.1);
        }
        h2 { color: #0b1437; margin-bottom: 10px; font-size: 24px; }
        p { color: #a3aed0; font-size: 15px; }
        
        /* Animasi Loading Berputar */
        .spinner {
            margin: 0 auto 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(67, 24, 255, 0.1);
            border-top: 4px solid #4318ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h2>Membuka SimDAWA</h2>
        <p>Mohon tunggu sebentar, sedang menyambungkan ke server...</p>
    </div>
</body>
</html>
