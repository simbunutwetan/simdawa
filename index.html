<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimDAWA | Kelurahan Bunut Wetan</title>
    </head>
<body>

    <div style="padding: 20px; max-width: 400px; margin: auto;">
        <h2>Form Data Warga</h2>
        <input type="text" id="namaWarga" placeholder="Nama Lengkap" required><br><br>
        <input type="text" id="nikWarga" placeholder="NIK" required><br><br>
        <button onclick="simpanData()">Simpan ke Spreadsheet</button>
    </div>

    <script>
        function simpanData() {
            var nama = document.getElementById("namaWarga").value;
            var nik = document.getElementById("nikWarga").value;

            // URL Google Script Anda (Backend)
            var urlApi = "https://script.google.com/macros/s/AKfycbzASBbH_MbdNFcws62JU69WIuWC6Q1nV2WuoAnorVlAe7jd3elSlqpklNm6mSikGNlCbQ/exec";

            // Mengirim data diam-diam di belakang layar
            fetch(urlApi, {
                method: "POST",
                body: JSON.stringify({ nama: nama, nik: nik })
            })
            .then(response => response.json())
            .then(hasil => {
                if(hasil.status === "sukses") {
                    alert("Mantap! " + hasil.pesan);
                } else {
                    alert("Gagal: " + hasil.pesan);
                }
            });
        }
    </script>
</body>
</html>
